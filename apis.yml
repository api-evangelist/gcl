name: GCL
description: >-
  GCL System Integration Technology Co., Ltd. (GCL SI, Shenzhen: 002506) is one of
  the four listed companies of China's GCL Group and a global leading provider of
  photovoltaic and clean-energy solutions. Headquartered in Suzhou Industrial Park,
  Jiangsu Province, the company manufactures high-efficiency solar cells, large-size
  photovoltaic modules, energy-storage systems, and next-generation perovskite solar
  technology, with operations spanning six continents. Surfaced as a portfolio company
  of Balderton Capital and added to the API Evangelist network; GCL SI is an industrial
  manufacturer and publishes no public developer/API surface at this time.
